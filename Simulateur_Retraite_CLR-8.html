        .pdf-departure-sub { font-size: 10px; color: #475569; margin-top: 2px; }

            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1e3a8a;
            margin-top: 22px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1.5px solid #bfdbfe;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pdf-section-title::before {
            content: '';
            display: inline-block;
            width: 4px; height: 14px;
            background: #2563eb;
            border-radius: 2px;
        }

        /* Tableaux */
        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 4px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 0 1px #e2e8f0;
        }
        .pdf-table th, .pdf-table td {
            padding: 7px 11px;
            text-align: left;
            font-size: 10.5px;
            border: none;
            border-bottom: 1px solid #f1f5f9;
        }
        .pdf-table th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            width: 40%;
        }
        .pdf-table td { color: #0f172a; font-weight: 500; }
        .pdf-table tr:last-child th,
        .pdf-table tr:last-child td { border-bottom: none; }
        .pdf-table tr.pdf-row-highlight th,
        .pdf-table tr.pdf-row-highlight td {
            background: #eff6ff;
            font-weight: 700;
            color: #1e3a8a;

        .pdf-table td.red { color: #b91c1c; }

        .pdf-table td.green { color: #15803d; }

            font-weight: 700;

// --- FONCTIONS DE FORMATAGE ---
const formatYMD = (yearsFloat) => {
    if (!yearsFloat || isNaN(yearsFloat) || yearsFloat === 0) return '0 an';
    
    let y = Math.floor(yearsFloat);
    let remYears = yearsFloat - y;
    let m = Math.floor(remYears * 12);
    let remMonths = (remYears * 12) - m;
    let d = Math.round(remMonths * 30.4375);

    if (d >= 30) { d = 0; m += 1; }
    if (m >= 12) { m = 0; y += 1; }

    let parts = [];
    if (y > 0) parts.push(`${y} an${y > 1 ? 's' : ''}`);
    if (m > 0) parts.push(`${m} mois`);
    if (d > 0) parts.push(`${d} jour${d > 1 ? 's' : ''}`);

    return parts.length > 0 ? parts.join(' ') : '0 an';
};

// --- FONCTIONS MOTEUR ---
const applySemesterRounding = (yearsFloat) => {
    if (!yearsFloat || isNaN(yearsFloat)) return 0;
    const yearsInt = Math.floor(yearsFloat);
    const fractionYear = yearsFloat - yearsInt;
    const months = fractionYear * 12;
    let roundedFraction = 0;
    if (months >= 8.95) roundedFraction = 1.0;
    else if (months >= 2.95) roundedFraction = 0.5;
    else roundedFraction = 0.0;
    return yearsInt + roundedFraction;
};

const getDecoteExacte = (retirementDate, ageExact) => {
    const rYear = retirementDate.getFullYear();
    if (rYear <= 2025) {
        if (ageExact < 56.5) return 40;
        if (ageExact < 57.5) return 35;
        if (ageExact < 58.5) return 24;
        if (ageExact < 59.5) return 16;
        if (ageExact < 60.5) return 10;
        return 0; 
    }
    if (rYear === 2026) {
        if (ageExact < 57.0) return 40;
        if (ageExact < 58.0) return 35;
        if (ageExact < 59.0) return 24;
        if (ageExact < 60.0) return 16;
        if (ageExact < 61.0) return 10;
        return 0; 
    }
    if (rYear >= 2027) {
        if (ageExact < 57.5) return 40;
        if (ageExact < 58.5) return 35;
        if (ageExact < 59.5) return 24;
        if (ageExact < 60.5) return 16;
        if (ageExact < 61.5) return 10;
        return 0; 
    }
    return 0; 
};

const computeProjectedGradeState = (targetRetirementDateStr, corps, grade, startEchelon, dateEchelon, availStart, availEnd, availStart2, availEnd2) => {
    if (!corps || !grade || !startEchelon || !dateEchelon || !targetRetirementDateStr) return null;
    if (corps === "Autre (Saisie Manuelle)") return null;
    if (!GRILLES || !GRILLES[corps] || !GRILLES[corps][grade]) return null;
    
    const grid = GRILLES[corps][grade];
    const retireDate = new Date(targetRetirementDateStr);
    const startDate = new Date(dateEchelon);
    if (isNaN(retireDate.getTime()) || isNaN(startDate.getTime())) return null;
    
    let currentEchIndex = grid.findIndex(g => g.ech === parseInt(startEchelon));
    if (currentEchIndex === -1) currentEchIndex = grid.findIndex(g => g.ech === startEchelon);
    if (currentEchIndex === -1) return null;

    let currentDate = new Date(startDate);
    let currentStep = grid[currentEchIndex];

    // Tableau des périodes de dispo (1 ou 2) - logique identique appliquée à chacune
    const dispoPeriods = [];
    if (availStart && availEnd) {
        const s = new Date(availStart);
        const e = new Date(availEnd);
        if (e > s) dispoPeriods.push({ start: s, end: e, duration: e - s });
    }
    if (availStart2 && availEnd2) {
        const s = new Date(availStart2);
        const e = new Date(availEnd2);
        if (e > s) dispoPeriods.push({ start: s, end: e, duration: e - s });
    }

    while (currentDate < retireDate) {
        if (currentStep.dur === 0) break; 
        let durationMs = currentStep.dur * 30.44 * 24 * 3600 * 1000;
        let nextDate = new Date(currentDate.getTime() + durationMs);
        dispoPeriods.forEach(p => {
            if (nextDate > p.start && currentDate < p.end) {
                nextDate = new Date(nextDate.getTime() + p.duration);
            }
        });
        if (nextDate < retireDate) {
            currentEchIndex++;
            currentStep = grid[currentEchIndex];
            currentDate = nextDate;
        } else {
            break;
        }
    }
    
    let retainedINM = currentStep.inm;
    let retainedEch = currentStep.ech;
    let warning = null;

    const dateRequired = new Date(currentDate);
    const retireYear = retireDate.getFullYear();
    let reqMonths = 16; 
    if (retireYear === 2025) reqMonths = 12;
    else if (retireYear === 2026) reqMonths = 14;
    else if (retireYear >= 2027) reqMonths = 16;
    
    dateRequired.setMonth(dateRequired.getMonth() + reqMonths);
    dispoPeriods.forEach(p => {
        if (p.start > currentDate && p.start < dateRequired) {
            dateRequired.setTime(dateRequired.getTime() + p.duration);
        }
    });

    if (retireDate < dateRequired) {
        if (currentEchIndex > 0) {
            let prevStep = grid[currentEchIndex - 1];
            retainedINM = prevStep.inm;
            retainedEch = prevStep.ech;
            warning = `Echelon ${currentStep.ech} non validé (Requis : ${dateRequired.toLocaleDateString()}). Calcul rétrogradé à l'échelon ${prevStep.ech}.`;
        } else {
             warning = `Attention : Ancienneté insuffisante dans le 1er échelon.`;
        }
    }

    return {
        base: retainedINM * VALEUR_POINT_CLR,
        inm: retainedINM,
        ech: retainedEch,
        warning: warning
    };
};

const calculatePensionEngine = (params) => {
    const {
        birthDate, entryDate, retirementDate, 
        availabilityStart, availabilityEnd,
        availabilityStart2, availabilityEnd2,
        baseClrInput, majorationIndiciaire,   
        residenceNC, sex, isChildDisabled,                          
        childrenBefore2004, childrenAfter2004,
        childrenInterruptionCount, 
        childrenDependent, 
        bonificationYears,
        studyBuyback, 
        rates,
        projectedBaseClr,
        projectedInm
    } = params;

    if (!birthDate || !entryDate || !retirementDate) return null;

    const rDate = new Date(retirementDate);
    const bDate = new Date(birthDate);
    const eDate = new Date(entryDate);
    
    if (isNaN(rDate.getTime()) || isNaN(bDate.getTime()) || isNaN(eDate.getTime())) return null;

    const rYear = rDate.getFullYear();

    let minorationRate = (rYear <= 2025) ? 9.0 : 8.0;
    if (rates.minoration !== '' && rates.minoration !== null && !isNaN(parseFloat(rates.minoration))) {
        minorationRate = parseFloat(rates.minoration);
    }

    let ageYears = rDate.getFullYear() - bDate.getFullYear();
    let ageMonths = rDate.getMonth() - bDate.getMonth();
    let ageDays = rDate.getDate() - bDate.getDate();
    if (ageDays < 0) ageMonths--;
    if (ageMonths < 0) { ageYears--; ageMonths += 12; }
    const exactAgeAtDeparture = ageYears + (ageMonths / 12) + (ageDays / 365.25);

    const rawServiceDays = Math.max(0, (rDate - eDate) / (1000 * 3600 * 24));
    let availabilityDays = 0;
    if (availabilityStart && availabilityEnd) {
        const aStart = new Date(availabilityStart);
        const aEnd = new Date(availabilityEnd);
        if (aEnd > aStart) availabilityDays = (aEnd - aStart) / (1000 * 3600 * 24);
    }
    if (availabilityStart2 && availabilityEnd2) {
        const aStart2 = new Date(availabilityStart2);
        const aEnd2 = new Date(availabilityEnd2);
        if (aEnd2 > aStart2) availabilityDays += (aEnd2 - aStart2) / (1000 * 3600 * 24);
    }
    const netServiceDays = Math.max(0, rawServiceDays - availabilityDays);
    const totalService = netServiceDays / 365.25; 
    const bonifs = parseFloat(bonificationYears && typeof bonificationYears === 'string' ? bonificationYears.replace(',', '.') : bonificationYears) || 0;
    const buyback = parseFloat(studyBuyback) || 0; 

    let bonusTimeChildren = 0;
    if (sex === 'F') {
        bonusTimeChildren = parseFloat(childrenBefore2004 || 0) * 1.0;
    } else {
        bonusTimeChildren = parseInt(childrenInterruptionCount || 0) * 1.0; 
    }
    
    const rawTotalAnnuities = totalService + bonifs + bonusTimeChildren + buyback;
    const totalAnnuities = applySemesterRounding(rawTotalAnnuities);
    const totalServiceRounded = applySemesterRounding(totalService);

    const liquidationAnnuities = Math.min(totalAnnuities, 40); 
    const tauxBase = liquidationAnnuities * 2.0;

    let ageLegal = 60;
    if (rYear === 2025) ageLegal = 60.5;
    if (rYear >= 2026) ageLegal = 61;

    let decotePercent = 0;
    if (totalServiceRounded < 40 && exactAgeAtDeparture < 62) { 
        decotePercent = getDecoteExacte(rDate, exactAgeAtDeparture);
    }

    let isCarriereLongue = false;
    if (decotePercent > 0 && totalServiceRounded >= 35) {
        decotePercent = decotePercent * 0.75; 
        isCarriereLongue = true;
    }

    let surcoteRate = 0;
    if (totalAnnuities > 40) {
        const pivotSurcote = new Date('2027-01-01');
        if (rDate > pivotSurcote) {
            const rawYearsAfterPivot = (rDate - pivotSurcote) / (1000 * 3600 * 24 * 365.25);
            const yearsAfterPivot = applySemesterRounding(rawYearsAfterPivot);
            const eligibleExtraYears = Math.min(totalAnnuities - 40, yearsAfterPivot);
            
            if (eligibleExtraYears > 0) {
                let ratePerYear = (rYear < 2030) ? 1.5 : 2.0; 
                surcoteRate = Math.min(eligibleExtraYears * ratePerYear, 10.0);
            }
        }
    }

    let baseToUse = projectedBaseClr !== null ? projectedBaseClr : parseFloat(baseClrInput || 0);
    if (baseToUse <= 0 || isNaN(baseToUse)) return null;

    let assietteCalcul = baseToUse + parseFloat(majorationIndiciaire || 0);
    
    const tauxGlobalAffiche = tauxBase + surcoteRate;
    const vpCLR = 56.7946;
    const indexCLR = 1.73;

    const pensionBaseMontant = assietteCalcul * (tauxBase / 100); 
    
    let desindexationBase = 0;
    let baseEffective = pensionBaseMontant;

    if (!residenceNC && totalService > 0) {
        const pivotDate = new Date('2005-07-01');
        let yearsPre2005 = 0;
        if (eDate < pivotDate) {
             const endDatePre = rDate < pivotDate ? rDate : pivotDate;
             yearsPre2005 = Math.max(0, (endDatePre - eDate) / (1000 * 3600 * 24 * 365.25));
        }
        yearsPre2005 = Math.min(yearsPre2005, totalService);
        desindexationBase = pensionBaseMontant * (0.73 / 1.73) * (yearsPre2005 / totalService);
        baseEffective = Math.max(0, pensionBaseMontant - desindexationBase);
    }

    const montantDecote = baseEffective * (decotePercent / 100);
    const montantSurcote = baseEffective * (surcoteRate / 100);
    const pensionBruteTotale = baseEffective - montantDecote + montantSurcote;

    const totalChildren = parseFloat(childrenBefore2004) + parseFloat(childrenAfter2004);
    let majEnfantPercent = 0;
    if (totalChildren >= 3) {
        majEnfantPercent = parseFloat(childrenDependent || 0) * 5.0;
    }
    
    let familyAmount = pensionBruteTotale * (majEnfantPercent / 100);
    if (pensionBruteTotale + familyAmount > (assietteCalcul * (baseEffective/pensionBaseMontant))) {
        familyAmount = Math.max(0, (assietteCalcul * (baseEffective/pensionBaseMontant)) - pensionBruteTotale);
    }
    const totalBrutAjuste = pensionBruteTotale + familyAmount;

    const chargesMinoration = baseEffective * (minorationRate / 100);
    const baseRuammCcs = Math.max(0, totalBrutAjuste - chargesMinoration);
    
    const chargesRUAMM = baseRuammCcs * (rates.ruamm / 100);
    const chargesCCS = residenceNC ? baseRuammCcs * (rates.ccs / 100) : 0;
    const chargesMutuelle = parseFloat(rates.mutuelle || 0);

    const totalDeductions = chargesMinoration + chargesRUAMM + chargesCCS + chargesMutuelle;
    let netToPay = totalBrutAjuste - totalDeductions;
    
    let isMinimumVital = false;
    if (netToPay < MINIMUM_VITAL) {
        netToPay = MINIMUM_VITAL;
        isMinimumVital = true;
    }
    
    let isEligible = (totalService >= 15);
    let specialEligibility = false;
    if (isChildDisabled) {
        specialEligibility = true;
        isEligible = true;
    }

    return {
        retirementDate, 
        ageDisplay: Math.floor(exactAgeAtDeparture), 
        ageMonthsDisplay: Math.round((exactAgeAtDeparture - Math.floor(exactAgeAtDeparture))*12),
        totalAnnuities, totalService, totalServiceRounded,
        bonifs, bonusTimeChildren, availabilityDays, buyback,
        
        tauxGlobalAffiche: tauxBase + surcoteRate, 
        tauxBaseAff: tauxBase,
        decotePercent,     
        surcoteRate,
        isCarriereLongue,
        pensionBaseMontant, 
        baseEffective,
        desindexationBase,
        inm: projectedInm,
        minorationRate,
        
        vp: vpCLR,
        index: indexCLR,
        traitementBrut: baseEffective,
        montantDecote,
        montantSurcote,
        
        netToPay, totalBrutAjuste, 
        totalDeductions, baseUsed: baseToUse, majEnfantPercent,
        chargesDetail: {
            minoration: chargesMinoration,
            ruamm: chargesRUAMM,
            ccs: chargesCCS,
            mutuelle: chargesMutuelle
        },
        isEligible,
        specialEligibility,
        isMinimumVital
    };
};

};

const SimulateurRetraiteNC = () => {
  const [birthDate, setBirthDate] = useState('');
  const [entryDate, setEntryDate] = useState('');
  const [sex, setSex] = useState('H'); 
  const [isChildDisabled, setIsChildDisabled] = useState(false);
  
  const [hasAvailability, setHasAvailability] = useState(false);
  const [availabilityStart, setAvailabilityStart] = useState('');
  const [availabilityEnd, setAvailabilityEnd] = useState('');
  const [hasAvailability2, setHasAvailability2] = useState(false);
  const [availabilityStart2, setAvailabilityStart2] = useState('');
  const [availabilityEnd2, setAvailabilityEnd2] = useState('');

  const [residenceNC, setResidenceNC] = useState(true); 
  
  const [childrenBefore2004, setChildrenBefore2004] = useState(0);
  const [childrenInterruptionCount, setChildrenInterruptionCount] = useState(0); 
  const [childrenAfter2004, setChildrenAfter2004] = useState(0);
  const [childrenDependent, setChildrenDependent] = useState(0);

  const [currencyEur, setCurrencyEur] = useState(false);
  const [baseClrInput, setBaseClrInput] = useState(''); 
  const [majorationIndiciaire, setMajorationIndiciaire] = useState(0); 
  const [bonificationYears, setBonificationYears] = useState(0);
  const [studyBuyback, setStudyBuyback] = useState(''); 
  const [isAutoBonification, setIsAutoBonification] = useState(true); 
  
  const [rates, setRates] = useState({ minoration: '', ruamm: 1.5, ccs: 1.30, mutuelle: 0 }); 

  const [selectedCorps, setSelectedCorps] = useState('');
  const [selectedGrade, setSelectedGrade] = useState('');
  const [currentEchelon, setCurrentEchelon] = useState(1);
  const [echelonDate, setEchelonDate] = useState('');
  const [projectedData, setProjectedData] = useState(null);
  
  const [customRetireDate, setCustomRetireDate] = useState('');
  const [showPdfModal, setShowPdfModal] = useState(false); // État pour afficher le modal PDF

  const autoRetirementDate = useMemo(() => {
      if(!birthDate) return '';
      const d = new Date(birthDate);
      if(isNaN(d.getTime())) return '';
      d.setHours(12, 0, 0, 0);
      d.setMonth(d.getMonth() + (62 * 12)); 
      return d.toISOString().split('T')[0];
  }, [birthDate]);

  const [activeTab, setActiveTab] = useState('simulation'); 
  const [showDeductionSettings, setShowDeductionSettings] = useState(false);

  useEffect(() => {
    if (parseInt(childrenInterruptionCount) > parseInt(childrenBefore2004)) {
        setChildrenInterruptionCount(childrenBefore2004);
    }
  }, [childrenBefore2004, childrenInterruptionCount]);

  useEffect(() => {
    if (entryDate && autoRetirementDate && isAutoBonification) {
        const start = new Date(entryDate);
        const end = new Date(autoRetirementDate);
        const pivot = new Date('2003-07-01');
        
        if (end > start) {
            let bonusDays = 0;
            if (start < pivot) {
                const endP1 = end < pivot ? end : pivot;
                const durationP1Days = (endP1 - start) / (1000 * 3600 * 24);
                bonusDays += durationP1Days * (1/3);
            }
            if (end > pivot) {
                const startP2 = start > pivot ? start : pivot;
                const durationP2Days = (end - startP2) / (1000 * 3600 * 24);
                bonusDays += durationP2Days * 0.10;
            }
            const totalBonusYears = bonusDays / 365.25;
            setBonificationYears(totalBonusYears.toFixed(2));
        }
    }
  }, [entryDate, autoRetirementDate, isAutoBonification]);

  useEffect(() => {
    if (selectedCorps === "Autre (Saisie Manuelle)") {
        setProjectedData(null); 
        return;
    }
    const res = computeProjectedGradeState(
        autoRetirementDate, 
        selectedCorps, selectedGrade, currentEchelon, echelonDate, 
        availabilityStart, availabilityEnd,
        availabilityStart2, availabilityEnd2
    );
    setProjectedData(res);
  }, [selectedCorps, selectedGrade, currentEchelon, echelonDate, autoRetirementDate, availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2]);


  const mainResults = useMemo(() => {
    return calculatePensionEngine({
        birthDate, entryDate, retirementDate: autoRetirementDate,
        availabilityStart, availabilityEnd,
        availabilityStart2, availabilityEnd2,
        baseClrInput, majorationIndiciaire,
        residenceNC, sex, isChildDisabled,
        childrenBefore2004, childrenInterruptionCount, childrenAfter2004,
        childrenDependent, 
        bonificationYears, studyBuyback, rates,
        projectedBaseClr: (selectedCorps !== "Autre (Saisie Manuelle)" && projectedData) ? projectedData.base : null,
        projectedInm: (selectedCorps !== "Autre (Saisie Manuelle)" && projectedData) ? projectedData.inm : null
    });
  }, [birthDate, entryDate, autoRetirementDate, availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2, baseClrInput, majorationIndiciaire, residenceNC, sex, isChildDisabled, childrenBefore2004, childrenInterruptionCount, childrenAfter2004, childrenDependent, bonificationYears, studyBuyback, rates, projectedData, selectedCorps]);

  const scenarios = useMemo(() => {
      if (!birthDate || !entryDate) return [];
      const ages = [58, 59, 60, 61];
      return ages.map(age => {
          const bDate = new Date(birthDate);
          const targetDate = new Date(bDate.getFullYear() + age, bDate.getMonth(), bDate.getDate(), 12, 0, 0);
          const targetDateStr = targetDate.toISOString().split('T')[0];
          
          let specificProjectedBase = null;
          let specificProjectedInm = null;
          let warningMsg = null;
          
          if (selectedCorps !== "Autre (Saisie Manuelle)") {
              const proj = computeProjectedGradeState(
                  targetDateStr, selectedCorps, selectedGrade, currentEchelon, echelonDate, availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2
              );
              if (proj) {
                  specificProjectedBase = proj.base;
                  specificProjectedInm = proj.inm;
                  warningMsg = proj.warning;
              }
          }

          const res = calculatePensionEngine({
            birthDate, entryDate, retirementDate: targetDateStr,
            availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2, baseClrInput, majorationIndiciaire, residenceNC, sex, isChildDisabled,
            childrenBefore2004, childrenInterruptionCount, childrenAfter2004, childrenDependent,
            bonificationYears, studyBuyback, rates,
            projectedBaseClr: specificProjectedBase,
            projectedInm: specificProjectedInm
          });
          
          if (!res) return null; 
          return { ...res, gradeWarning: warningMsg };
      });
  }, [birthDate, entryDate, availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2, baseClrInput, majorationIndiciaire, residenceNC, sex, isChildDisabled, childrenBefore2004, childrenInterruptionCount, childrenAfter2004, childrenDependent, bonificationYears, studyBuyback, rates, selectedCorps, selectedGrade, currentEchelon, echelonDate]);

  const customScenario = useMemo(() => {
      if (!birthDate || !entryDate || !customRetireDate) return null;
      
      let specificProjectedBase = null;
      let specificProjectedInm = null;
      let warningMsg = null;

      if (selectedCorps !== "Autre (Saisie Manuelle)") {
          const proj = computeProjectedGradeState(
              customRetireDate, selectedCorps, selectedGrade, currentEchelon, echelonDate, availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2
          );
          if (proj) {
              specificProjectedBase = proj.base;
              specificProjectedInm = proj.inm;
              warningMsg = proj.warning;
          }
      }

      const res = calculatePensionEngine({
          birthDate, entryDate, retirementDate: customRetireDate,
          availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2, baseClrInput, majorationIndiciaire, residenceNC, sex, isChildDisabled,
          childrenBefore2004, childrenInterruptionCount, childrenAfter2004, childrenDependent,
          bonificationYears, studyBuyback, rates,
          projectedBaseClr: specificProjectedBase,
          projectedInm: specificProjectedInm
      });

      if (!res) return null; 
      return { ...res, gradeWarning: warningMsg };
  }, [birthDate, entryDate, customRetireDate, availabilityStart, availabilityEnd, availabilityStart2, availabilityEnd2, baseClrInput, majorationIndiciaire, residenceNC, sex, isChildDisabled, childrenBefore2004, childrenInterruptionCount, childrenAfter2004, childrenDependent, bonificationYears, studyBuyback, rates, selectedCorps, selectedGrade, currentEchelon, echelonDate]);


  const formatXPF = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '---';
      if (currencyEur) return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(val * 0.00838);
      return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'XPF', maximumFractionDigits: 0 }).format(val);
  };

  // Regroupement des inputs pour le modal PDF
  const currentInputs = { birthDate, entryDate, selectedCorps, selectedGrade };

  return (
    <div className="max-w-5xl mx-auto p-4 bg-slate-100 min-h-screen font-sans text-slate-800">
      
      {/* Inclusion du Modal PDF (caché par défaut) */}
      <ReportModal 
        isOpen={showPdfModal} 
        onClose={() => setShowPdfModal(false)} 
        scen={customScenario} 
        rates={rates} 
        formatXPF={formatXPF} 
        inputs={currentInputs}
        residenceNC={residenceNC}

                                        <div className="text-2xl font-bold text-blue-800">{formatXPF(customScenario.netToPay)} <span className="text-sm font-normal text-slate-500">net/mois</span></div>
                                    </div>
                                    <div className={`text-xs font-bold px-2 py-1 rounded ${customScenario.decotePercent > 0 ? 'bg-orange-100 text-orange-700' : (customScenario.surcoteRate > 0 ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700')}`}>
                                        {customScenario.decotePercent > 0 ? `Décote -${(customScenario.decotePercent || 0).toFixed(1)}%` : (customScenario.tauxGlobalAffiche > 80 ? 'Surcote' : 'Taux Plein')}
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4 text-xs">
                                    <div className="space-y-1">
                                        <div className="flex justify-between"><span>Age au départ</span><span className="font-bold">{customScenario.ageDisplay} ans {customScenario.ageMonthsDisplay} mois</span></div>
                                        <div className="flex justify-between"><span>Services Effectifs</span><span>{formatYMD(customScenario.totalService)}</span></div>
                                        <div className="flex justify-between"><span>Services Eff. (Décote)</span><span>{formatYMD(customScenario.totalServiceRounded)}</span></div>
                                    </div>
                                    <div className="space-y-1 border-l pl-4 border-slate-100">
                                        <div className="flex justify-between"><span>Annuités Liquidables</span><span className="font-bold">{formatYMD(customScenario.totalAnnuities)}</span></div>
                                        <div className="flex justify-between"><span>Bonifications Totales</span><span className="text-blue-600">+{formatYMD((parseFloat(customScenario.bonifs) || 0) + (parseFloat(customScenario.bonusTimeChildren) || 0) + (parseFloat(customScenario.buyback) || 0))}</span></div>
                                    </div>
                                </div>
                                
                                {customScenario.gradeWarning && (
                                    <div className="mt-2 p-1 bg-orange-50 border border-orange-100 rounded text-[9px] text-orange-700 leading-tight">
                                        <span className="font-bold">⚠ Attention :</span> {customScenario.gradeWarning}
                                    </div>
                                )}
                                
                                <div className="mt-4">
                                    <ClrReceipt scen={customScenario} rates={rates} formatXPF={formatXPF} defaultOpen={true} residenceNC={residenceNC} />
                                </div>
                            </div>
                        )}
                    </div>
                </div>

                {/* PIED DE PAGE AVEC LIEN REGLES */}
                <div className="mt-8 text-center border-t pt-4">
                    <a href="https://www.clr.nc/" target="_blank" className="text-blue-600 hover:text-blue-800 text-sm font-semibold flex items-center justify-center gap-2">
                        <Icon name="external-link" className="w-4 h-4"/>
                        Consulter les règles officielles sur le site de la CLR
                    </a>
                </div>
                </>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SimulateurRetraiteNC />);

</script>
</body>
</html>
